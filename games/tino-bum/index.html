<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tino Bum! · I giochi di Tino</title>
  <meta name="description" content="Artiglieria a turni tra le isole: scegli il mezzo, prendi la mira e tieni d'occhio il vento.">
  <link rel="icon" href="../../assets/tino/tino-normale.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/sito.css">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header class="barra">
    <a class="barra-home" href="../../index.html" aria-label="Torna ai giochi">&larr; <span>Giochi</span></a>
    <div id="turno" class="turno" aria-live="polite"></div>
    <div class="barra-destra">
      <button id="btn-pausa" class="barra-btn" type="button" aria-label="Pausa" title="Pausa (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="btn-audio" class="barra-btn" type="button" aria-label="Suoni" title="Suoni (M)">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="palco" class="palco">
    <div id="schermo" class="schermo">
      <canvas id="campo" aria-label="Campo di gioco"></canvas>
      <div id="plancia" class="plancia nascosta">
        <div class="gruppo solo-touch">
          <button type="button" class="tondo" data-tieni="sinistra" aria-label="Sinistra">◀</button>
          <button type="button" class="tondo" data-tieni="destra" aria-label="Destra">▶</button>
        </div>
        <div class="centro">
          <div class="riga-alta">
            <div class="energia" title="Movimento rimasto"><span>Passi</span><div class="barretta"><i id="barra-energia"></i></div></div>
            <div id="colpi" class="colpi"></div>
            <div id="tempo" class="tempo" title="Secondi rimasti"></div>
          </div>
          <div class="riga-bassa">
            <div id="angolo" class="angolo">45°</div>
            <div class="barra-potenza" title="Potenza (il segno rosso è il tiro prima)">
              <i id="riempi"></i><b id="segno"></b>
              <span class="tacca" style="left:25%"></span><span class="tacca" style="left:50%"></span><span class="tacca" style="left:75%"></span>
            </div>
          </div>
        </div>
        <div class="gruppo solo-touch">
          <div class="alzo">
            <button type="button" class="tondo piccolo" data-tieni="su" aria-label="Alza">▲</button>
            <button type="button" class="tondo piccolo" data-tieni="giu" aria-label="Abbassa">▼</button>
          </div>
          <button type="button" class="tira" data-tieni="tira">TIRA</button>
        </div>
      </div>
    </div>

    <div id="pannello" class="pannello" role="dialog" aria-modal="true"></div>

    <div class="gira" aria-live="polite">
      <img src="../../assets/tino/tino-normale.png" alt="">
      <p>Gira il telefono in orizzontale per giocare</p>
    </div>
  </main>

  <script src="mezzi.js"></script>
  <script src="terreno.js"></script>
  <script src="gioco.js"></script>
</body>
</html>
