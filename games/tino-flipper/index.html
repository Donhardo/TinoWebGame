<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tino Flipper · I giochi di Tino</title>
  <meta name="description" content="Il flipper di Tino: un tavolo alto due schermi tra le radici della quercia, con quattro flipper, rampe, tunnel, giro della morte, multiball e avventure.">
  <link rel="icon" href="../../assets/tino/tino-normale.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/sito.css">
  <link rel="stylesheet" href="stile.css">
</head>
<body>
  <header class="barra">
    <a class="barra-home" href="../../index.html" aria-label="Torna ai giochi">&larr; <span>Giochi</span></a>
    <div class="tabellone" aria-live="polite">
      <span class="punti"><b id="punti">0</b></span>
      <span id="palle" class="palle" aria-label="Palle"></span>
    </div>
    <div class="barra-destra">
      <button id="btn-vista" class="barra-btn" type="button" aria-label="Tavolo intero" title="Tavolo intero (V)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 7h4M10 12h4M10 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-pausa" class="barra-btn" type="button" aria-label="Pausa" title="Pausa (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="btn-musica" class="barra-btn" type="button" aria-label="Musica" title="Musica (N)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6"/><circle cx="16.5" cy="15.5" r="2.6"/><path class="barra-no" d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-audio" class="barra-btn" type="button" aria-label="Suoni" title="Suoni (M)">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="palco" class="palco">
    <canvas id="campo" aria-label="Tavolo del flipper"></canvas>
    <div id="pannello" class="pannello" role="dialog" aria-modal="true"></div>

    <div class="gira" aria-live="polite">
      <img src="../../assets/tino/tino-normale.png" alt="">
      <p>Gira il telefono in verticale per giocare</p>
    </div>
  </main>

  <script src="motore.js"></script>
  <script src="tavoli/radici.js"></script>
  <script src="gioco.js"></script>
</body>
</html>
