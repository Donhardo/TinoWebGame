<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tino e la Ghianda d'Oro · I giochi di Tino</title>
  <meta name="description" content="Tino, con cappello e frusta, attraversa radici, tempio e uffici della Tari tra trappole, porte e agenti per salvare Gino.">
  <link rel="icon" href="../../assets/tino/tino-normale.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/sito.css">
  <link rel="stylesheet" href="stile.css">
  <link rel="manifest" href="../../manifest.webmanifest">
  <meta name="theme-color" content="#4f9a3f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tino">
  <link rel="apple-touch-icon" href="../../assets/icone/apple-touch-icon.png">
  <script src="../../js/sito.js" defer></script>
</head>
<body>
  <header class="barra">
    <a class="barra-home" href="../../index.html" aria-label="Torna ai giochi">&larr; <span>Giochi</span></a>
    <div class="titolo-livello" id="titolo-livello" aria-live="polite"></div>
    <div class="barra-destra">
      <div class="chiavi" id="chiavi" aria-label="Chiavi"></div>
      <div class="robivecchi" id="robivecchi" aria-label="Robivecchi del livello"></div>
      <div class="ceci" id="ceci" aria-label="Ceci"></div>
      <button id="btn-pausa" class="barra-btn" type="button" aria-label="Pausa" title="Pausa (P)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      </button>
      <button id="btn-audio" class="barra-btn" type="button" aria-label="Suoni" title="Suoni (M)">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="palco" class="palco">
    <canvas id="campo" aria-label="Il tempio"></canvas>

    <div class="tasti-touch" id="tasti-touch" aria-hidden="true">
      <div class="croce" id="croce">
        <span data-tasto="sx">&#9664;</span>
        <span class="su-giu"><span data-tasto="su">&#9650;</span><span data-tasto="giu">&#9660;</span></span>
        <span data-tasto="dx">&#9654;</span>
      </div>
      <div class="azioni">
        <button type="button" data-tasto="frusta" class="t-frusta">Frusta</button>
        <button type="button" data-tasto="salta" class="t-salta">Salta</button>
      </div>
    </div>

    <div id="pannello" class="pannello" role="dialog" aria-modal="true"></div>

    <div class="gira" aria-live="polite">
      <img src="../../assets/tino/tino-normale.png" alt="">
      <p>Gira il telefono in orizzontale per giocare</p>
    </div>
  </main>

  <script src="livelli.js"></script>
  <script src="gioco.js"></script>
</body>
</html>
